services:
  - type: web
    name: calculator-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CALCULATOR_DB
        value: /data/calculator.db
    disk:
      name: calculator-data
      mountPath: /data
      sizeGB: 1
